name: Push to ECR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write      # Needed for OIDC login to AWS
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show OIDC token claims (temporary debug)
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | python3 -c "import sys,json,base64;p=sys.stdin.read().split('.')[1];c=json.loads(base64.urlsafe_b64decode(p+'='*(-len(p)%4)));print(json.dumps({k:c[k] for k in ('sub','aud','iss')},indent=2))"

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::936719391115:role/github-demo-app-ecr
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/demo-app
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"