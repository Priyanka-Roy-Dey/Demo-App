name: CI                                  # Name shown in the Actions tab

on:                                       # WHEN to run
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:                      # Adds a manual "Run workflow" button

jobs:
  build:                                  # Job ID (any name)
    runs-on: ubuntu-latest                # WHERE: GitHub-hosted runner
    # runs-on: [ cai-standard-x86-linux ] # ...or Cox self-hosted, like cms-web

    steps:                                # WHAT to do, in order
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build